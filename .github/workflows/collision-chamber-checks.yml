name: Collision Chamber Checks

on:
  pull_request:
    paths:
      - 'app/particle-chamber/**'
      - 'app/projects.ts'
      - 'package.json'
      - 'tests/collision-chamber.test.mjs'
      - 'docs/collision-chamber.md'
      - '.github/workflows/collision-chamber-checks.yml'

permissions:
  contents: read

jobs:
  particle-chamber:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Collision Chamber numerical regression tests
        run: node --test tests/collision-chamber.test.mjs
      - name: Existing model regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
