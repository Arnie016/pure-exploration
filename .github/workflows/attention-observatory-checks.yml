name: Attention Observatory Checks

on:
  pull_request:
    paths:
      - 'app/attention/**'
      - 'app/projects.ts'
      - 'tests/attention-lab.test.mjs'
      - '.github/workflows/attention-observatory-checks.yml'

permissions:
  contents: read

jobs:
  attention-world:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Attention regression checks
        run: node --test tests/attention-lab.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
