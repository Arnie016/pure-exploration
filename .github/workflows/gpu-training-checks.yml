name: GPU Training Lab Checks

on:
  pull_request:
    paths:
      - 'app/gpu-training/**'
      - 'app/projects.ts'
      - 'app/components/portal-directory.tsx'
      - 'app/components/collection.tsx'
      - 'app/components/world-help.tsx'
      - 'tests/gpu-training.test.mjs'
      - '.github/workflows/gpu-training-checks.yml'

permissions:
  contents: read

jobs:
  gpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gradient and training regression tests
        run: node --test tests/gpu-training.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
